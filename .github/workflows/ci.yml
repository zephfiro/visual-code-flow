name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: | 
          npm run format:check || { npx prettier --write packages/flow-core/src/model.ts packages/flow-core/src/model.test.ts packages/flow-core/src/validation.ts; git diff -- packages/flow-core/src; exit 1; }
