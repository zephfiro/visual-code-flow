name: Temporary PHP review workspace
on:
  push:
    branches: [feat/vcf-030-php-vscode]
    paths: [.github/workflows/review-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Archive tracked sources and installed public dependencies only
        shell: bash
        run: |
          git ls-files -z | tar --null -T - -cf /tmp/vcf-review.tar
          tar --append --file=/tmp/vcf-review.tar node_modules package-lock.json
          gzip -1 /tmp/vcf-review.tar
      - uses: actions/upload-artifact@v4
        with:
          name: vcf-review-${{ github.sha }}
          path: /tmp/vcf-review.tar.gz
          retention-days: 1
          if-no-files-found: error
