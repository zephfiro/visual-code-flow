name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Formatting diagnostics (temporary)
        run: |
          echo '=== CONTRACT ==='
          npx prettier packages/shared/src/language-adapter.ts
          echo '=== TEST ==='
          npx prettier packages/shared/src/language-adapter.test.ts
          echo '=== INDEX ==='
          npx prettier packages/shared/src/index.ts
      - run: npm run format:check
