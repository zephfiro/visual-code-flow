name: PHP foundation validation
on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/analyzer-php/**'
      - '.github/workflows/php-foundation-validation.yml'
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test -w @visual-code-flow/analyzer-php
      - name: Capture reproducible source and dependencies for offline review
        if: always()
        run: tar --exclude=.git --exclude=.vscode-test --exclude='.env*' -czf /tmp/vcf-review.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-foundation-offline-review
          path: /tmp/vcf-review.tar.gz
          retention-days: 1
          if-no-files-found: error
